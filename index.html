<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Boing Boing</title>
    <meta
      name="description"
      content="Boing Boing — a 2D side-scrolling game."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bungee&family=IBM+Plex+Sans:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="hud">
        <p class="brand">Boing Boing</p>
        <p id="status" class="status">Arrow keys / WASD to move · Space to jump</p>
      </header>
      <canvas id="game" width="960" height="540" aria-label="Boing Boing game canvas"></canvas>
      <div id="overlay" class="overlay" hidden>
        <p class="overlay-brand">Boing Boing</p>
        <p class="overlay-copy">Press Enter or click to start</p>
      </div>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
